# Footval run configuration — spec section 1 values + per-model API registry.
#
# Model IDs and API params WILL drift; fix them HERE, never in code.
# `make probe` makes one cheap call per model and prints resolved snapshot IDs.
# `output_usd_per_mtok:` is the provider's list price per 1M OUTPUT tokens
# (verified 2026-07-31; prices drift — update here). Billable output includes
# thinking tokens: Gemini reports them separately (thoughts_tokens, billed as
# output); the other providers fold them into output_tokens already.
# `params:` is merged verbatim into the provider call (config wins on conflict).
# `judge_params:` is merged on top of `params:` only when the model is acting as a
# pairwise judge — all three judges are also candidates and judge at a higher
# effort than they answer at.

candidate_models:
  - claude-fable-5
  - claude-opus-5
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gemini-3.1-pro-preview
  - gemini-3.6-flash
  - glm-5.2

n_samples: 1              # responses generated per candidate
gen_temperature: 1.0      # fixed for all candidates (where the API accepts it)
judge_temperature: 0.0    # judges run as deterministically as the APIs allow
seed: 42                  # where the provider supports it
interval_tol: 0.10        # relative tolerance for parameter-reproduction check

generation:
  max_output_tokens: 64000

# Pairwise comparison stage — the only judging round. Two criteria, judged in
# separate row-scoped calls (analytical_reasoning over the analytics row,
# intuitive_reasoning over the intuition row), text-only, forced A/B. Batch APIs
# where available; z.ai has none, so GLM runs through `make pairwise-sync`.
pairwise:
  judges:
    - claude-fable-5
    - gpt-5.6-sol
    - glm-5.2
  both_orders: true   # round 2: judge every pair in the reversed order too
  # Judges deliberate at one effort tier above the candidates, so leave room for
  # thinking tokens — a 16k cap starved the previous panel on close comparisons.
  max_output_tokens: 32000
  max_format_retries: 2

# Thinking/effort policy: candidates run one notch above the middle of each
# provider's ladder, judges one notch above that.
#   Anthropic / OpenAI  low > medium > high > xhigh > max   candidate high, judge xhigh
#   Gemini              minimal > low > medium > high       candidate HIGH (no Gemini judge)
#   z.ai GLM            high > max                          candidate high, judge max
models:
  # --- Anthropic. Fable 5 / Opus 5 / Sonnet 5 all reject temperature/top_p/top_k
  # (400), so it is omitted for all three. `thinking: adaptive` + output_config.effort
  # is the only thinking-depth surface; budget_tokens is rejected.
  claude-fable-5:
    provider: anthropic
    family: anthropic
    output_usd_per_mtok: 50.00
    supports_temperature: false
    supports_seed: false
    params:
      thinking: {type: adaptive}
      output_config: {effort: high}
    judge_params:
      output_config: {effort: xhigh}
  claude-opus-5:
    provider: anthropic
    family: anthropic
    output_usd_per_mtok: 25.00
    supports_temperature: false
    supports_seed: false
    params:
      thinking: {type: adaptive}
      output_config: {effort: high}
  # --- OpenAI (Responses API). Reasoning models reject sampling params; no seed
  # on the Responses API. reasoning.effort ladder: none/low/medium/high/xhigh/max.
  gpt-5.6-sol:
    provider: openai
    family: openai
    output_usd_per_mtok: 30.00
    supports_temperature: false
    supports_seed: false
    params:
      reasoning: {effort: high}
    judge_params:
      reasoning: {effort: xhigh}
  gpt-5.6-terra:
    provider: openai
    family: openai
    output_usd_per_mtok: 15.00
    supports_temperature: false
    supports_seed: false
    params:
      reasoning: {effort: high}

  # --- Google Gemini (google-genai SDK). params merge into GenerateContentConfig.
  # thinking_level replaced thinking_budget in Gemini 3.x and tops out at HIGH.
  # Candidates only — no Gemini model sits on the judge panel.
  gemini-3.1-pro-preview:
    provider: gemini
    family: google
    output_usd_per_mtok: 12.00
    supports_temperature: true
    supports_seed: true
    params:
      thinking_config: {thinking_level: HIGH}
  gemini-3.6-flash:
    provider: gemini
    family: google
    output_usd_per_mtok: 7.50
    supports_temperature: true
    supports_seed: true
    params:
      thinking_config: {thinking_level: HIGH}

  # --- Z.ai GLM (OpenAI-compatible chat completions). No batch API, so its judge
  # items run synchronously. `thinking` is a z.ai-only knob; the adapter ships it
  # via extra_body because the OpenAI SDK rejects unknown kwargs.
  glm-5.2:
    provider: zai
    family: zai
    output_usd_per_mtok: 4.40
    base_url: https://api.z.ai/api/paas/v4
    supports_temperature: true
    supports_seed: false
    params:
      thinking: {type: enabled}
      reasoning_effort: high
    judge_params:
      reasoning_effort: max
