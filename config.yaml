# Footval run configuration — spec section 1 values + per-model API registry.
#
# Model IDs and API params WILL drift; fix them HERE, never in code.
# `make probe` makes one cheap call per model and prints resolved snapshot IDs.
# `params:` is merged verbatim into the provider call (config wins on conflict).

candidate_models:
  - claude-fable-5
  - claude-opus-4-8
  - claude-sonnet-5
  - claude-haiku-4-5-20251001
  - gpt-5.5-pro
  - gpt-5.5
  - gpt-5.4-mini
  - gemini-3.1-pro-preview
  - gemini-3.5-flash
  - gemini-3.1-flash-lite
  - deepseek-v4-pro
  - deepseek-v4-flash

n_samples: 1              # responses generated per candidate
gen_temperature: 1.0      # fixed for all candidates (where the API accepts it)
judge_temperature: 0.0    # judges run as deterministically as the APIs allow
seed: 42                  # where the provider supports it
interval_tol: 0.10        # relative tolerance for parameter-reproduction check

sandbox:
  image: footval-sandbox
  timeout_seconds: 60
  memory: 1g
  cpus: 1
  pids: 256

generation:
  max_output_tokens: 64000
judging:
  max_output_tokens: 16000
  max_format_retries: 2

# Pairwise comparison stage (criteria 1-2 only, text-only, batch APIs where
# available). both_orders=true would judge every pair in both presentation
# orders (doubles cost; default off — A/B is seeded-random per pair instead).
pairwise:
  judges:
    - claude-opus-4-8
    - gpt-5.5
    - gemini-3.5-flash
    - deepseek-v4-pro
  both_orders: true   # round 2: judge every pair in the reversed order too
  # opus-4-8 at effort max burned a 16k cap on thinking alone for close
  # comparisons (28/66 returned zero text); 32k gives deliberation headroom
  max_output_tokens: 32000  # 5 pathological near-ties needed a one-off 64k resubmission

models:
  # --- Anthropic: highest thinking = adaptive + effort max (spec: max for fable-5).
  # Fable 5 / Opus 4.8 reject temperature/top_p/top_k (400); thinking-enabled
  # models can't take temperature either, so it is omitted for all four.
  claude-fable-5:
    provider: anthropic
    family: anthropic
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      thinking: {type: adaptive}
      output_config: {effort: max}
  claude-opus-4-8:
    provider: anthropic
    family: anthropic
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      thinking: {type: adaptive}
      output_config: {effort: max}
  claude-sonnet-5:
    provider: anthropic
    family: anthropic
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      # Adaptive thinking at effort max made Sonnet 5 think past its 64k output
      # ceiling and return ZERO text — the same failure mode as Sonnet 4.6, the
      # model it replaces (see the preserved response.effort-max-attempt.json).
      # Sonnet 5 removed `thinking: enabled` + budget_tokens (400), so 4.6's
      # capped-budget fallback doesn't exist; effort is the only thinking-depth
      # knob. xhigh is the highest configuration this model can complete within
      # the shared 64k output budget. Documented deviation from "effort max".
      thinking: {type: adaptive}
      output_config: {effort: xhigh}
  claude-haiku-4-5-20251001:
    provider: anthropic
    family: anthropic
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      thinking: {type: enabled, budget_tokens: 32000}  # no adaptive/effort on Haiku 4.5

  # --- OpenAI (Responses API). Reasoning models reject sampling params; no seed
  # on the Responses API. Raise reasoning.effort here if a higher tier exists.
  gpt-5.5-pro:
    provider: openai
    family: openai
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      reasoning: {effort: high}
  gpt-5.5:
    provider: openai
    family: openai
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      reasoning: {effort: high}
  gpt-5.4-mini:
    provider: openai
    family: openai
    supports_temperature: false
    supports_seed: false
    supports_images: true
    params:
      reasoning: {effort: high}

  # --- Google Gemini (google-genai SDK). params merge into GenerateContentConfig.
  gemini-3.1-pro-preview:
    provider: gemini
    family: google
    supports_temperature: true
    supports_seed: true
    supports_images: true
    params:
      thinking_config: {thinking_level: HIGH}
  gemini-3.5-flash:
    provider: gemini
    family: google
    supports_temperature: true
    supports_seed: true
    supports_images: true
    params:
      thinking_config: {thinking_level: HIGH}
  gemini-3.1-flash-lite:
    provider: gemini
    family: google
    supports_temperature: true
    supports_seed: true
    supports_images: true
    params:
      thinking_config: {thinking_level: HIGH}

  # --- DeepSeek (OpenAI-compatible chat completions). Vision unverified, so
  # supports_images=false: the judge falls back to text-only and records it.
  deepseek-v4-pro:
    provider: deepseek
    family: deepseek
    base_url: https://api.deepseek.com
    supports_temperature: true
    supports_seed: false
    supports_images: false
    params: {}
  deepseek-v4-flash:
    provider: deepseek
    family: deepseek
    base_url: https://api.deepseek.com
    supports_temperature: true
    supports_seed: false
    supports_images: false
    params: {}
