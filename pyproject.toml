[project]
name = "footbench"
version = "0.1.0"
description = "Multi-model LLM evaluation: NFL strategy recommendations with calibrated priors"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "google-genai>=2.8.0",
    "krippendorff>=0.8.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "polars>=1.41.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footbench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# judge.py embeds the spec's rubric anchors verbatim; they must not be rewrapped
"footbench/judge.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
