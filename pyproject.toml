[project]
name = "footval"
version = "0.1.0"
description = "Multi-model LLM evaluation: NFL strategy recommendations with calibrated priors"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "arviz>=1.2.0",
    "google-genai>=2.8.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "polars>=1.41.2",
    "pymc>=6.0.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.scripts]
footval = "footval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/footval",
    "/tests",
    "/config.yaml",
    "/footval.prompt.md",
    "/footval.judge.analytical.prompt.md",
    "/footval.judge.intuitive.prompt.md",
    "/initial_prompt.md",
    "/Makefile",
    "/CLAUDE.md",
    "/.python-version",
]
exclude = [
    "/artifacts",
    "/outputs",
    "/dist",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.env",
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]

[tool.hatch.build.targets.wheel]
packages = ["footval"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Notebook cells keep their hand-laid layout (chart specs, wide tables)
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files embed the rubric descriptions / exact JSON shapes verbatim;
# they must not be rewrapped
"footval/pairwise.py" = ["E501"]
"tests/test_pairwise.py" = ["E501"]
# Notebook idioms: repeated imports per cell, long chart-spec lines
"*.ipynb" = ["E402", "E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
# Notebook rendering lives here too: altair/matplotlib are used only by
# outputs/*.ipynb, never by the footval package itself.
dev = [
    "altair>=6.2.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "vl-convert-python>=1.9.0.post1",
]
