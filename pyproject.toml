[project]
name = "footbench"
version = "0.1.0"
description = "Multi-model LLM evaluation: NFL strategy recommendations with calibrated priors"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.1",
    "anthropic>=0.109.1",
    "google-genai>=2.8.0",
    "krippendorff>=0.8.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "polars>=1.41.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.scripts]
footbench = "footbench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/footbench",
    "/tests",
    "/config.yaml",
    "/footbench.prompt.md",
    "/initial_prompt.md",
    "/Makefile",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/.python-version",
]
exclude = [
    "/artifacts",
    "/outputs",
    "/dist",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.env",
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
]

[tool.hatch.build.targets.wheel]
packages = ["footbench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files embed the spec's rubric anchors / exact JSON shapes verbatim;
# they must not be rewrapped
"footbench/judge.py" = ["E501"]
"footbench/pairwise.py" = ["E501"]
"tests/test_pairwise.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
